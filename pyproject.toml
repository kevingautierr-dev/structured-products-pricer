[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer"
version = "0.1.0"
description = "Monte Carlo pricer for structured products (BRC, Phoenix autocall)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]